<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almunqith · HeatSafe Care</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#193c38;--muted:#7a8d88;--green:#247a68;--line:#e3eae6;--bg:#f4f7f4;--warm:#f6e5c2;--red:#ba5948}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:0}h1,h2,h3,h4,p{margin:0}h1,h2,h3{font-family:Manrope,sans-serif}button{border-radius:9px;padding:10px 16px;background:#edf3ee;color:var(--ink);font-weight:600}button:hover{filter:brightness(.96)}button.primary{background:var(--green);color:white}button.outline{border:1px solid var(--line);background:white}button.danger{background:#fbece6;color:#a54736}small,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700;color:var(--green)}.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.7px}.mark{display:grid;place-items:center;background:var(--green);border-radius:12px;width:36px;height:36px;color:#fff;font-size:27px;font-weight:400}.switchbar{min-height:52px;background:#173e36;color:#dbe9df;display:flex;justify-content:space-between;align-items:center;padding:8px 28px;gap:12px}.switchbar small{color:#b1c9bc}.switchbar button{padding:7px 15px;font-size:12px;background:transparent;color:#b6ccbf}.switchbar button.active{background:#ffffff;color:#214e41}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}aside{background:#fff;border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}.side-label{font-size:10px;color:#91a19a;letter-spacing:1.6px;margin:40px 12px 14px}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;color:#74877e;padding:13px 14px;font-weight:500}nav button.active{background:#eaf3ec;color:#25614d;font-weight:700}nav button span{margin-right:13px}.sidefoot{margin-top:auto;padding-top:60px}.professional{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#e0e9d9;border-radius:50%;font-weight:700;color:#53704d}.main{padding:30px 36px;max-width:1600px;width:100%;margin:auto}.toprow,.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.pagehead{margin:28px 0}.pagehead h1{font-size:28px;letter-spacing:-1px;margin-bottom:7px}.date{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:5px 10px;border-radius:30px;font-size:11px;font-weight:600;background:#eaf2e5;color:#5d7a43;white-space:nowrap}.pill.red{background:#f8e5df;color:#ae5140}.pill.amber{background:#fbefda;color:#a47c30}.pill.gray{background:#eef0ed;color:#7a8880}.coverage{display:flex;align-items:center;gap:10px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#70a765}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.stat-title{color:var(--muted);font-size:12px}.stat-value{font-size:30px;font-weight:700;margin:13px 0 6px;letter-spacing:-1px}.stat-bottom{font-size:10px;color:#8c9b92}.stat-icon{width:30px;height:30px;border-radius:9px;background:#eff4eb;display:grid;place-items:center;color:#769160}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.weather{background:#eff1df;border-color:#e5e8d1;position:relative;overflow:hidden}.weather h2{font-size:17px;margin-top:10px}.sun{font-size:54px;color:#b99d58}.weather .temp{font-size:46px;letter-spacing:-2px;font-weight:600}.weather p{line-height:1.7;font-size:12px;color:#7c8067}.rule{height:1px;background:var(--line);margin:18px 0}.section-title{font-size:16px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{text-transform:uppercase;letter-spacing:1px;font-size:9px;font-weight:600;color:#8a9b90;padding:17px 12px;border-bottom:1px solid var(--line)}td{padding:17px 12px;border-bottom:1px solid #edf1ed;font-size:12px}tbody tr{cursor:pointer}tbody tr:hover{background:#f8faf6}.name{font-weight:700;color:#23483e}.patientcell{display:flex;align-items:center;gap:10px}.patientcell .avatar{width:32px;height:32px;font-size:10px}.alertitem{display:flex;align-items:flex-start;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.alert-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#fbefda;color:#bc9854;flex-shrink:0}.alertitem p{font-size:12px;line-height:1.6;margin:5px 0}.alertitem h4{font-size:12px}.alertitem button{font-size:10px;padding:7px 10px}.tabsline{display:flex;gap:6px;margin:22px 0 5px}.tabsline button{font-size:11px;background:transparent;color:var(--muted)}.tabsline .active{background:#eaf3ec;color:var(--green)}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);max-width:100%}label{display:block;font-size:12px;margin:12px 0 7px}.notice{padding:12px 16px;border-radius:9px;background:#eef3e9;line-height:1.6;font-size:12px;margin:14px 0}.empty{text-align:center;padding:35px;color:var(--muted)}.feed{font-size:12px;line-height:1.7}.feeditem{border-left:2px solid #d8e5d4;padding:0 0 20px 14px;margin-top:10px}.feeditem small{display:block;font-size:10px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.banner{background:#fff8e8;border:1px solid #f1e6ca;border-radius:10px;padding:10px 15px;font-size:11px;color:#9b813f}.mobile-stage{min-height:calc(100vh - 52px);display:grid;grid-template-columns:1fr 410px 1fr;gap:60px;padding:42px;align-items:start;background:radial-gradient(ellipse at center,#e3eada,#f4f7f4 70%)}.demo-copy{max-width:300px;justify-self:end;margin-top:75px}.demo-copy h1{font-size:37px;line-height:1.25;letter-spacing:-1.5px;margin:18px 0}.demo-copy p{color:var(--muted);line-height:1.8}.phone{background:#f7f9f3;border:8px solid #243f34;border-radius:44px;box-shadow:0 25px 65px #244b3220;overflow:hidden;min-height:790px;position:relative}.phone-status{display:flex;justify-content:space-between;padding:16px 23px 8px;font-size:11px;font-weight:700}.phone header{padding:16px 22px}.phone-content{padding:8px 20px 96px;min-height:620px}.phone h1{font-size:26px;letter-spacing:-.8px;line-height:1.3}.phone h2{font-size:17px}.phone .card{padding:18px;border-radius:18px;margin-top:14px}.phone .weather{margin-top:20px}.phone .weather h2{font-size:22px;line-height:1.4}.phone .weather p{color:#7c8067}.phone .section-title{margin-top:24px;font-size:14px}.phone-nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:13px 5px 18px}.phone-nav button{padding:3px 5px;background:transparent;color:#89998e;font-size:10px;display:grid;gap:5px}.phone-nav button span{font-size:20px}.phone-nav button.active{color:var(--green)}.vitals{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vitals strong{font-size:24px;display:block;margin:8px 0}.loginwrap{min-height:calc(100vh - 52px);display:grid;place-items:center;padding:30px}.login{width:440px;max-width:100%;padding:35px}.login h1{margin:25px 0 8px;font-size:28px}.login input{width:100%}.login .primary{width:100%;margin-top:22px}.login-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:25px 0}.login-options button.active{background:#dcebdc;color:#245b47}.modalback{position:fixed;inset:0;background:#173c3655;z-index:20;display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}.modal{max-height:90vh;overflow:auto;width:620px;max-width:100%;box-shadow:0 20px 80px #183b3330}.modal h2{font-size:23px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173e36;color:white;padding:14px 22px;border-radius:12px;z-index:100;box-shadow:0 8px 30px #0002;font-size:13px}.steps{display:flex;gap:6px;margin:20px 0}.steps i{height:4px;background:#dce6d8;flex:1;border-radius:4px}.steps i.active{background:var(--green)}.check{display:flex;align-items:center;gap:10px;line-height:1.5}.check input{accent-color:var(--green)}.chatbubble{border-radius:12px;padding:14px;background:#edf2e7;margin:12px 0;line-height:1.6;font-size:12px}.chatbubble.mine{margin-left:35px;background:#dcebdd}.rightnotes{margin-top:80px;max-width:245px}.rightnotes h3{font-size:14px;margin-bottom:8px}.rightnotes p{font-size:12px;color:var(--muted);line-height:1.8}.demo-note{font-size:10px;line-height:1.6;color:#91a090;margin-top:20px}#modal:empty{display:none}@media(max-width:1150px){.grid{grid-template-columns:1fr}.weathercol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mobile-stage{grid-template-columns:1fr 410px;gap:30px}.rightnotes{display:none}}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{padding:14px;border-right:0;border-bottom:1px solid var(--line)}aside nav{display:flex;overflow:auto;margin-top:12px}aside nav button{white-space:nowrap;padding:9px}.side-label,.sidefoot{display:none}.main{padding:20px}.stats{grid-template-columns:1fr 1fr}.switchbar{padding:8px 12px;flex-wrap:wrap}.toprow{flex-wrap:wrap}.mobile-stage{display:block;padding:25px 12px}.demo-copy{display:none}.phone{max-width:410px;margin:auto}.weathercol{display:block}.weathercol .card{margin-top:16px}.card{padding:17px}.date{display:none}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast" hidden></div><script>
const $=s=>document.querySelector(s);const KEY='almunqith-demo-v1';const seed={patients:[{id:'HS-001',name:'Ahmad Khalil',age:58,initials:'AK',city:'Amman',job:'Outdoor maintenance',conditions:'Hypertension · Type 2 diabetes',risk:'High',bp:'142/88',glucose:136,opens:24,last:'Today, 09:42',warnings:'Heat exposure, dehydration, dust',exam:true,questionnaire:true,educated:true},{id:'HS-002',name:'Lina Hassan',age:46,initials:'LH',city:'Zarqa',job:'Teacher',conditions:'Asthma',risk:'Moderate',bp:'122/78',glucose:98,opens:18,last:'Today, 08:35',warnings:'Dust, air quality, heat',exam:true,questionnaire:true,educated:true},{id:'HS-003',name:'Omar Saleh',age:67,initials:'OS',city:'Amman',job:'Retired',conditions:'Hypertension',risk:'High',bp:'148/91',glucose:112,opens:9,last:'Yesterday, 17:20',warnings:'Heat exposure, dehydration',exam:true,questionnaire:true,educated:true},{id:'HS-004',name:'Rana Nasser',age:34,initials:'RN',city:'Irbid',job:'Office administrator',conditions:'Type 2 diabetes',risk:'Moderate',bp:'119/76',glucose:124,opens:31,last:'Today, 10:05',warnings:'Heat exposure, dehydration',exam:true,questionnaire:true,educated:true}],alerts:[{id:1,patient:'HS-001',title:'Personalized heat warning',type:'Heat',severity:'High',status:'New',owner:'Pharmacist',time:'09:45',note:'Simulated 39°C forecast combined with outdoor work and doctor-defined heat warnings.'},{id:2,patient:'HS-003',title:'Abnormal blood pressure reading',type:'Reading',severity:'Moderate',status:'New',owner:'Pharmacist',time:'09:30',note:'Simulated reading is outside the patient’s doctor-reviewed target range.'},{id:3,patient:'HS-002',title:'Dust exposure warning',type:'Weather',severity:'Moderate',status:'In review',owner:'Pharmacist',time:'09:10',note:'Simulated dust conditions matched to the patient’s asthma warnings.'},{id:4,patient:'HS-004',title:'Emergency indicators reported',type:'Emergency',severity:'Urgent',status:'With doctor',owner:'Doctor',time:'08:50',note:'Simulated emergency indicators. Direct doctor referral; doctor decides appointment or emergency care.'}],logs:[{time:'08:50',text:'Rana Nasser · Emergency indicators routed directly to Dr. Yara Haddad. Awaiting doctor decision.',reason:'Emergency',status:'Pending'}],coverage:true,doses:{},readings:[],messages:[],onboarding:0,answers:{}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}let mode='dashboard',page='overview',mobilePage='home',filter='All',query='',session=false,loginRole='patient';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function notify(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.hidden=true,3200)}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function now(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}function patient(id){return state.patients.find(p=>p.id===id)}function badge(t){return `<span class="pill ${['High','Urgent','Emergency','With doctor'].includes(t)?'red':['Moderate','In review','Pending'].includes(t)?'amber':['Closed','Resolved'].includes(t)?'gray':''}">${esc(t)}</span>`}function log(text,reason='Manual referral',status='Pending'){state.logs.unshift({time:now(),text,reason,status});save()}function setMode(m){mode=m;if(m==='patient'){const p=patient('HS-001');p.opens++;p.last='Today, '+now();save()}render()}function head(){return `<div class="switchbar"><div><b>HeatSafe demo</b> <small> / Almunqith care platform · simulated data</small></div><div><button class="${mode==='patient'?'active':''}" onclick="setMode('patient')">Patient mobile app</button><button class="${mode==='dashboard'?'active':''}" onclick="setMode('dashboard')">Pharmacist dashboard</button><button onclick="session=false;render()">Demo accounts ↗</button></div></div>`}function logo(){return '<div class="logo"><span class="mark">✳</span> almunqith<span style="color:#8aab75">.</span></div>'}
function render(){ $('#app').innerHTML=head()+(!session?login():mode==='patient'?mobile():dashboard());}function login(){return `<div class="loginwrap"><div class="card login">${logo()}<div class="eyebrow" style="margin-top:30px">A little care. A safer day.</div><h1>Welcome to HeatSafe</h1><p class="muted">Explore the complete care experience.</p><div class="login-options"><button class="${loginRole==='patient'?'active':''}" onclick="loginRole='patient';render()">♧ Patient</button><button class="${loginRole==='professional'?'active':''}" onclick="loginRole='professional';render()">✳ Pharmacist / HCP</button></div><form onsubmit="signIn(event)"><label>Email address</label><input id="email" type="email" required value="${loginRole==='patient'?'patient':'pharmacist'}@heatsafe.demo"><label>Password</label><input id="password" type="password" required value="HeatSafe123!"><button class="primary" type="submit">Open ${loginRole==='patient'?'patient app':'care dashboard'} →</button><p id="loginerror" style="color:var(--red);margin-top:10px;font-size:12px"></p></form><div class="notice">Demo password: <b>HeatSafe123!</b><br>Fictional accounts and records. Changes stay in this browser.</div><p class="demo-note">Interface prototype · no real authentication, clinical assessment, live weather, or external notifications.</p></div></div>`}function signIn(e){e.preventDefault();const mail=$('#email').value.trim(),pw=$('#password').value;if(pw!=='HeatSafe123!'||!['patient@heatsafe.demo','pharmacist@heatsafe.demo'].includes(mail)){$('#loginerror').textContent='Use one of the demo accounts and the displayed password.';return}session=true;setMode(mail.startsWith('patient')?'patient':'dashboard')}
function navigate(p){page=p;render()}function dashboard(){const titles={overview:['Care overview','A clear picture of your patients, one day at a time.'],patients:['Patient records','Personalized profiles, clinical context and app activity.'],alerts:['Alerts & follow-up','Review, act and keep every care decision connected.'],handover:['Handover log','Every transfer, doctor decision and outcome in one place.'],simulation:['Demo scenarios','Explore the care workflow with simulated events.']};const t=titles[page];return `<div class="shell"><aside>${logo()}<div class="side-label">CARE WORKSPACE</div><nav>${[['overview','◫','Overview'],['patients','♧','Patients'],['alerts','♧','Alerts & follow-up'],['handover','≡','Handover log'],['simulation','✳','Demo scenarios']].map(([id,i,l])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span>${i}</span>${l}</button>`).join('')}</nav><div class="sidefoot"><div class="notice"><b>Connected care</b><br>Doctor-led warnings.<br>Patient-centered follow-up.</div><div class="professional"><div class="avatar">SA</div><div><b style="font-size:12px">Sara Ahmad</b><br><small style="font-size:10px">Pharmacist · Demo account</small></div></div></div></aside><main class="main"><div class="toprow"><span class="eyebrow">YOUR CARE WORKSPACE</span><div class="coverage"><span class="dot" style="background:${state.coverage?'#70a765':'#bc8c4b'}"></span>${state.coverage?'On duty · 8-hour coverage':'Off duty · doctor receives alerts'} <button class="outline" style="font-size:10px;padding:6px 10px" onclick="toggleCoverage()">${state.coverage?'End shift':'Start shift'}</button></div></div><div class="pagehead row"><div><h1>${t[0]}</h1><p class="muted">${t[1]}</p></div><span class="date">Demo day · 9 November 2026</span></div>${page==='overview'?overview():page==='patients'?patientsPage():page==='alerts'?alertsPage():page==='handover'?handover():simulation()}<p class="demo-note">SIMULATED CARE ENVIRONMENT · Weather, medical records and clinical alerts are fictional. Actions are saved locally in this browser.</p></main></div>`}
function overview(){const open=state.alerts.filter(a=>!['Resolved','Closed'].includes(a.status)).length;return `<div class="stats">${[['Enrolled patients',state.patients.length,'All patients examined by a doctor','♧'],['Open alerts',open,'Personalized follow-up needed','♧'],['High heat risk',state.patients.filter(p=>p.risk==='High').length,'Based on simulated patient profiles','☀'],['Care log entries',state.logs.length,'Transfers and handling history','↗']].map(([l,v,s,i])=>`<div class="card"><div class="row"><span class="stat-title">${l}</span><span class="stat-icon">${i}</span></div><div class="stat-value">${v}</div><div class="stat-bottom">${s}</div></div>`).join('')}</div><div class="grid"><div><div class="card"><div class="row"><h2 class="section-title">Patients to keep an eye on</h2><button class="outline" style="font-size:11px" onclick="navigate('patients')">View all patients ↗</button></div>${patientTable(state.patients)}</div><div class="card" style="margin-top:22px"><div class="row"><h2 class="section-title">Recent alerts</h2><button class="outline" style="font-size:11px" onclick="navigate('alerts')">View all alerts ↗</button></div>${state.alerts.slice(0,3).map(alertCard).join('')}</div></div><div class="weathercol"><div class="card weather"><div class="row"><span class="eyebrow">SIMULATED WEATHER</span><span>Amman ↗</span></div><div class="row" style="margin-top:22px"><div><div class="temp">39°<span style="font-size:17px">C</span></div><small>Feels like 42°C</small></div><div class="sun">☀</div></div><h2>A warmer day ahead</h2><p style="margin-top:10px">Outdoor patients may need extra support. Warnings follow each patient’s doctor-defined set.</p><div class="rule"></div><div class="row"><small>Humidity <b>24%</b></small><small>UV index <b>9 · High</b></small></div><button class="primary" style="width:100%;margin-top:22px" onclick="simulate('heat')">Simulate heat alert</button></div><div class="card" style="margin-top:22px"><h3 class="section-title">Care activity</h3><div class="feed" style="margin-top:18px">${state.logs.slice(0,3).map(l=>`<div class="feeditem"><small>${l.time} · ${l.reason}</small>${esc(l.text)}</div>`).join('')}</div><button class="outline" style="width:100%;font-size:11px" onclick="navigate('handover')">Open handover log →</button></div></div></div>`}
function patientTable(ps){return `<div class="tablewrap"><table><thead><tr><th>Patient</th><th>Condition</th><th>Heat risk</th><th>Last app open</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr onclick="showPatient('${p.id}')"><td><div class="patientcell"><span class="avatar">${p.initials}</span><div class="name">${p.name}<br><small style="font-weight:400">${p.id} · ${p.age} years</small></div></div></td><td>${p.conditions.split(' · ').join('<br>')}</td><td>${badge(p.risk)}</td><td><small>${p.last}<br>${p.opens} app opens</small></td><td>↗</td></tr>`).join('')}</tbody></table>${ps.length?'':'<div class="empty">No patients match this search.</div>'}</div>`}function patientsPage(){return `<div class="card"><div class="row"><h2 class="section-title">Patient directory <small>(${state.patients.length})</small></h2><input placeholder="Search name, ID or condition…" value="${esc(query)}" aria-label="Search patients" oninput="query=this.value;$('#patient-results').innerHTML=patientTable(state.patients.filter(p=>(p.name+' '+p.id+' '+p.conditions).toLowerCase().includes(query.toLowerCase())))"></div><div id="patient-results">${patientTable(state.patients.filter(p=>(p.name+' '+p.id+' '+p.conditions).toLowerCase().includes(query.toLowerCase())))}</div></div>`}
function alertCard(a){const p=patient(a.patient);return `<div class="alertitem"><span class="alert-icon" style="${a.type==='Emergency'?'background:#f8e5df;color:#ae5140':''}">${a.type==='Emergency'?'!':a.type==='Reading'?'♡':'☀'}</span><div style="flex:1"><div class="row"><h4>${esc(a.title)}</h4>${badge(a.status)}</div><p>${p.name} <span class="muted">· ${a.time} · ${a.owner}</span></p><small>${esc(a.note)}</small><div class="btnrow"><button class="outline" onclick="showAlert(${a.id})">Review alert →</button></div></div></div>`}function alertsPage(){return `<div class="card"><div class="row"><h2 class="section-title">Patient alerts</h2><button class="primary" onclick="simulate('heat')">+ Simulate heat alert</button></div><div class="tabsline">${['All','New','In review','With doctor','Resolved'].map(f=>`<button class="${f===filter?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>${state.alerts.filter(a=>filter==='All'||a.status===filter).map(alertCard).join('')||'<div class="empty">No alerts in this category.</div>'}</div>`}
function handover(){return `<div class="banner">Pharmacist coverage: 8 hours per workday. Outside coverage, new and pending alerts transfer automatically to the doctor. Emergency indicators always go directly to the doctor.</div><div class="card" style="margin-top:20px"><div class="row"><h2 class="section-title">Transfer & handling history</h2><button class="outline" onclick="exportLog()">Export CSV ↓</button></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>Transfer reason</th><th>Handling / doctor action</th><th>Outcome</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td>${l.time}</td><td>${esc(l.reason)}</td><td style="white-space:normal;min-width:280px;line-height:1.7">${esc(l.text)}</td><td>${badge(l.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function simulation(){return `<div class="grid"><div class="card"><div class="eyebrow">DEMO CONTROLS</div><h2 style="margin:15px 0">Walk through a care scenario</h2><p class="muted" style="line-height:1.8">Create a fictional event, follow its routing and review the result in the patient app and handover log.</p>${[['heat','☀','Personalized heat alert','Match simulated heat to Ahmad’s warnings set.'],['reading','♡','Abnormal health reading','Add a fictional out-of-range reading.'],['emergency','!','Emergency indicators','Refer directly to the doctor for a decision.'],['unclaimed','↗','Five-hour unclaimed alert','Simulate the unclaimed-alert deadline and transfer.']].map(([id,i,t,d])=>`<div class="alertitem"><span class="alert-icon">${i}</span><div style="flex:1"><h4>${t}</h4><p class="muted">${d}</p><button class="outline" onclick="simulate('${id}')">Run scenario →</button></div></div>`).join('')}<div class="btnrow"><button class="primary" onclick="toggleCoverage()">${state.coverage?'Simulate end of pharmacist shift':'Start pharmacist shift'}</button><button class="outline" onclick="setMode('patient');mobilePage='onboarding';render()">Preview patient onboarding</button><button class="danger" onclick="resetDemo()">Reset demo</button></div></div><div class="card" style="height:fit-content"><h3>Demo accounts</h3><div class="rule"></div><small>Patient</small><p style="margin:8px 0">patient@heatsafe.demo</p><small>Pharmacist / healthcare professional</small><p style="margin:8px 0">pharmacist@heatsafe.demo</p><div class="notice">Password for both:<br><b>HeatSafe123!</b></div><p class="muted" style="font-size:12px;line-height:1.8">These are browser-based demo identities. Both views share the same simulated records in this browser.</p></div></div>`}
function closeModal(){$('#modal').innerHTML=''}function modal(html){$('#modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal card"><div class="row"><span class="eyebrow">PATIENT CARE DETAILS</span><button aria-label="Close dialog" onclick="closeModal()">✕</button></div>${html}</section></div>`}function showPatient(id){const p=patient(id);modal(`<div class="row" style="margin-top:20px"><div><h2>${p.name}</h2><p class="muted" style="margin-top:8px">${p.id} · ${p.age} years · ${p.city}</p></div>${badge(p.risk+' heat risk')}</div><div class="rule"></div><p><b>${p.conditions}</b></p><p class="muted" style="margin-top:8px">${p.job}</p><div class="notice"><b>Doctor-defined tailored warnings</b><br>${p.warnings}</div><div class="vitals"><div class="card"><small>Last blood pressure</small><strong>${p.bp}</strong><small>mmHg · simulated</small></div><div class="card"><small>Last glucose</small><strong>${p.glucose}</strong><small>mg/dL · simulated</small></div></div><div class="rule"></div><h3 style="font-size:15px">Enrollment & education</h3><p style="line-height:2;margin-top:10px">✓ Pre-HeatSafe Questionnaire (Knowledge & Behavior)<br>✓ Doctor examination before registration<br>✓ Weather impact and precautions explained<br>✓ Tailored warnings set by doctor</p><div class="notice"><b>App activity</b><br>${p.opens} total opens · Last opened ${p.last}</div>${id==='HS-001'&&state.answers.knowledge?`<p class="muted">Latest demo questionnaire response: ${esc(state.answers.knowledge)} · Outdoor behavior: ${esc(state.answers.behavior)}</p>`:''}<div class="btnrow"><button class="primary" onclick="closeModal();navigate('alerts')">View patient alerts</button></div>`)}
function showAlert(id){const a=state.alerts.find(a=>a.id===id),p=patient(a.patient);modal(`<h2 style="margin-top:20px">${a.title}</h2><p class="muted" style="margin-top:8px">${p.name} · ${p.id} · ${a.time}</p><div class="btnrow">${badge(a.severity)}${badge(a.status)}${badge('Owner: '+a.owner)}</div><div class="notice">${esc(a.note)}</div><p class="muted" style="font-size:12px;line-height:1.8">${a.type==='Emergency'?'Emergency indicators → doctor review → doctor chooses an appointment or emergency care.':'During pharmacist coverage, normal alerts are reviewed here. Outside coverage they transfer automatically to the doctor.'}</p>${['Resolved','Closed'].includes(a.status)?'<div class="notice">This alert has been completed. Its action is recorded in the handover log.</div>':a.owner==='Doctor'?`<div class="banner" style="margin-top:18px">Doctor decision simulator · for demonstration only. These controls represent the doctor’s actions.</div><label>Appointment date / time</label><input id="appointment" type="datetime-local"><div class="btnrow"><button class="primary" onclick="doctorAction(${id},'appointment')">Simulate doctor: set appointment</button><button class="danger" onclick="doctorAction(${id},'emergency')">Simulate doctor: advise emergency care</button></div>`:`<label>Pharmacist follow-up message</label><textarea id="followup" rows="3" style="width:100%" placeholder="Enter the simulated follow-up message…"></textarea><div class="btnrow"><button class="outline" onclick="claimAlert(${id})">Take for review</button><button class="primary" onclick="resolveAlert(${id})">Notify patient & resolve</button><button class="danger" onclick="refer(${id})">Refer to doctor</button></div>`}`)}
function claimAlert(id){const a=state.alerts.find(a=>a.id===id);a.status='In review';log(`${patient(a.patient).name} · Sara Ahmad claimed alert #${id} for review.`,'Pharmacist review','In review');render();showAlert(id)}function resolveAlert(id){const msg=$('#followup').value.trim();if(!msg){notify('Add a follow-up message first.');return}const a=state.alerts.find(a=>a.id===id);a.status='Resolved';state.messages.unshift({patient:a.patient,text:msg,time:now(),by:'Sara Ahmad · Pharmacist'});log(`${patient(a.patient).name} · Pharmacist notified patient: ${msg}`,'Pharmacist follow-up','Resolved');closeModal();render();notify('Follow-up saved to the patient app.')}function refer(id){const a=state.alerts.find(a=>a.id===id);a.owner='Doctor';a.status='With doctor';log(`${patient(a.patient).name} · Alert #${id} referred to Dr. Yara Haddad. Awaiting doctor response.`);closeModal();render();notify('Referred to doctor and added to handover log.')}function doctorAction(id,type){const a=state.alerts.find(a=>a.id===id),date=$('#appointment')?.value;if(type==='appointment'&&!date){notify('Choose an appointment date and time.');return}const text=type==='appointment'?`Doctor scheduled an appointment: ${new Date(date).toLocaleString('en-GB')}.`:'Doctor advises emergency care: go to the nearest emergency department or call an ambulance, as directed.';a.status='Resolved';state.messages.unshift({patient:a.patient,text,time:now(),by:'Dr. Yara Haddad · Doctor'});state.logs.filter(l=>l.text.includes('Alert #'+id+' ')&&l.status==='Pending').forEach(l=>l.status='Handled');log(`${patient(a.patient).name} · Alert #${id} · ${text}`,'Doctor decision','Resolved');closeModal();render();notify('Doctor decision recorded; patient notified.')}
function toggleCoverage(){state.coverage=!state.coverage;if(!state.coverage){let count=0;state.alerts.forEach(a=>{if(a.owner==='Pharmacist'&&!['Resolved','Closed'].includes(a.status)){a.owner='Doctor';a.status='With doctor';count++;log(`${patient(a.patient).name} · Alert #${a.id} transferred automatically at shift end. Dr. Yara Haddad assigned; response pending.`,'Outside 8-hour coverage','Pending')}});notify(`${count} pending alert(s) automatically transferred to the doctor.`)}else notify('Pharmacist shift started. Existing doctor handovers retain their owner.');save();render()}
function simulate(type){if(type==='unclaimed'){const a=state.alerts.find(a=>a.owner==='Pharmacist'&&!['Resolved','Closed'].includes(a.status));if(!a){notify('No pending pharmacist alerts. Start a shift and create an alert first.');return}a.owner='Doctor';a.status='With doctor';log(`${patient(a.patient).name} · Alert #${a.id} reached the simulated 5-hour unclaimed deadline; automatically transferred to Dr. Yara Haddad.`,'5-hour deadline','Pending');save();render();notify('Five-hour escalation simulated.');return}const id=Math.max(...state.alerts.map(a=>a.id))+1;const a={id,patient:'HS-001',title:type==='heat'?'Personalized heat warning':type==='reading'?'Abnormal blood pressure reading':'Emergency indicators reported',type:type==='heat'?'Heat':type==='reading'?'Reading':'Emergency',severity:type==='emergency'?'Urgent':'High',status:type==='emergency'||!state.coverage?'With doctor':'New',owner:type==='emergency'||!state.coverage?'Doctor':'Pharmacist',time:now(),note:type==='heat'?'Simulated 39°C weather matched to Ahmad’s heat warnings and outdoor work.':type==='reading'?'Simulated reading is outside the doctor-reviewed patient range.':'Simulated emergency indicators. Routed directly to the doctor; awaiting appointment or emergency care decision.'};state.alerts.unshift(a);if(a.owner==='Doctor')log(`Ahmad Khalil · Alert #${id} sent directly to Dr. Yara Haddad. Response pending.`,type==='emergency'?'Emergency':'Outside 8-hour coverage','Pending');save();render();notify('Simulated alert created.');}
function exportLog(){const csv='Time,Reason,Handling,Status\n'+state.logs.map(l=>[l.time,l.reason,l.text,l.status].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='heatsafe-handover-log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetDemo(){modal('<h2 style="margin:20px 0">Reset simulated records?</h2><p class="muted">This clears demo changes in this browser and restores the original fictional records.</p><div class="btnrow"><button class="danger" onclick="state=structuredClone(seed);save();closeModal();render();notify(\'Demo reset.\')">Reset demo</button><button onclick="closeModal()">Cancel</button></div>')}
function mobile(){const p=patient('HS-001');return `<div class="mobile-stage"><div class="demo-copy"><span class="eyebrow">THE PATIENT EXPERIENCE</span><h1>Small steps.<br>Safer days.</h1><p>Personalized weather guidance and everyday care, always close at hand.</p><div class="notice">Demo patient<br><b>Ahmad Khalil · HS-001</b></div><button class="outline" onclick="mobilePage='onboarding';state.onboarding=0;save();render()">Preview enrollment journey →</button><p class="demo-note">Responsive mobile web app demo.<br>Switch to the dashboard to review shared data.</p></div><div class="phone"><div class="phone-status"><span>${now()}</span><span>••• ▰</span></div><header class="row">${logo()}<span class="avatar" style="width:30px;height:30px;font-size:10px">AK</span></header><div class="phone-content">${mobilePage==='home'?mobileHome(p):mobilePage==='health'?mobileHealth(p):mobilePage==='meds'?mobileMeds():mobilePage==='care'?mobileCare():mobileOnboarding()}</div><div class="phone-nav">${[['home','⌂','Home'],['health','♡','My health'],['meds','◷','Medication'],['care','☏','My care']].map(([id,i,l])=>`<button class="${mobilePage===id?'active':''}" onclick="mobilePage='${id}';render()"><span>${i}</span>${l}</button>`).join('')}</div></div><div class="rightnotes"><div class="eyebrow">CONNECTED TO YOUR CARE TEAM</div><h3 style="margin-top:22px">Doctor-led guidance</h3><p>Warnings reflect the set chosen during the doctor’s examination.</p><div class="rule"></div><h3>A clear path to care</h3><p>Emergency indicators go directly to the doctor, who decides an appointment or emergency care.</p><div class="rule"></div><h3>Every interaction counts</h3><p>App opens, readings, medication responses and follow-up actions are reflected in the demo dashboard.</p></div></div>`}
function mobileHome(p){const alerts=state.alerts.filter(a=>a.patient===p.id&&!['Resolved','Closed'].includes(a.status));return `<small>Monday, 9 November · Demo day</small><h1 style="margin-top:10px">Good morning,<br>Ahmad <span style="font-size:22px">☀</span></h1><p class="muted" style="margin-top:8px;font-size:12px">Let’s take care of you today.</p><div class="card weather"><div class="row"><span style="font-size:11px">☀ Amman · Simulated</span><b style="font-size:25px">39°C</b></div><h2 style="margin-top:22px">It’s a hot day.<br>Take it a little easier.</h2><p style="margin-top:12px">Your care plan includes heat precautions for outdoor work. Follow the guidance discussed with your doctor.</p><button class="outline" style="margin-top:18px;font-size:11px;background:#ffffff90" onclick="modal('<h2 style=\'margin-top:20px\'>Your tailored heat warning</h2><div class=\'notice\'>Demo guidance: follow the heat precautions explained by your doctor, plan breaks from outdoor heat and follow your individual care plan.</div><p class=\'muted\'>Doctor-defined warnings: heat exposure, dehydration and dust. Weather values are simulated.</p>')">Your personalized guidance ↗</button></div><div class="section-title row">Your health at a glance <button style="padding:4px;background:transparent;color:var(--green);font-size:10px" onclick="mobilePage='health';render()">View →</button></div><div class="vitals"><div class="card"><small>♡ Blood pressure</small><strong>${p.bp}</strong><small>mmHg · latest entry</small></div><div class="card"><small>◈ Blood glucose</small><strong>${p.glucose}</strong><small>mg/dL · latest entry</small></div></div><div class="section-title">Your care reminders</div><div class="card row"><div><b style="font-size:12px">◷ Morning medication</b><p class="muted" style="font-size:10px;margin-top:6px">Demo prescription · 08:00</p></div><button style="font-size:10px" onclick="mobilePage='meds';render()">${state.doses.morning||'View'}</button></div>${alerts.length?`<div class="notice">${alerts.length} care alert(s) in your record. <button style="font-size:10px;padding:4px 8px" onclick="mobilePage='care';render()">View care →</button></div>`:''}`}
function mobileHealth(p){return `<span class="eyebrow">YOUR HEALTH RECORD</span><h1 style="margin-top:12px">A little check-in</h1><p class="muted" style="line-height:1.7;margin-top:10px;font-size:12px">Add a simulated reading to your shared care record.</p><form class="card" onsubmit="addReading(event)"><label>Reading type</label><select id="readingtype" style="width:100%" onchange="$('#diastolicgroup').hidden=this.value!=='bp'"><option value="bp">Blood pressure (mmHg)</option><option value="glucose">Blood glucose (mg/dL)</option></select><label>Value / systolic</label><input id="readingvalue" type="number" min="1" max="600" required style="width:100%" placeholder="e.g. 128"><div id="diastolicgroup"><label>Diastolic</label><input id="diastolic" type="number" min="1" max="300" style="width:100%" placeholder="e.g. 82"></div><label class="check"><input id="abnormal" type="checkbox">Simulate outside doctor-reviewed range</label><button class="primary" style="width:100%;margin-top:12px">Save demo reading</button></form><div class="section-title">Recent readings</div>${state.readings.length?state.readings.slice(0,5).map(r=>`<div class="card row"><div><b>${r.value}</b><br><small>${r.type} · ${r.time}</small></div>${badge(r.abnormal?'Review requested':'Saved')}</div>`).join(''):`<div class="card"><b>${p.bp} mmHg</b><br><small>Blood pressure · simulated baseline</small><div class="rule"></div><b>${p.glucose} mg/dL</b><br><small>Blood glucose · simulated baseline</small></div>`}`}
function addReading(e){e.preventDefault();const type=$('#readingtype').value,v=$('#readingvalue').value,d=$('#diastolic').value,abnormal=$('#abnormal').checked;if(type==='bp'&&(!d||Number(d)<1)){notify('Enter both systolic and diastolic values.');return}const value=type==='bp'?`${v}/${d}`:v,p=patient('HS-001');if(type==='bp')p.bp=value;else p.glucose=Number(v);state.readings.unshift({value:value+(type==='bp'?' mmHg':' mg/dL'),type:type==='bp'?'Blood pressure':'Blood glucose',time:now(),abnormal});save();if(abnormal)simulate('reading');render();notify('Reading saved to shared demo record.')}
function mobileMeds(){return `<span class="eyebrow">YOUR DAILY ROUTINE</span><h1 style="margin-top:12px">Medication</h1><p class="muted" style="font-size:12px;line-height:1.7;margin-top:10px">Fictional medication reminders for the demo.</p>${[['morning','Morning medication','08:00'],['evening','Evening medication','20:00']].map(([id,t,time])=>`<div class="card"><div class="row"><h2 style="font-size:15px">${t}</h2>${badge(state.doses[id]||'Due')}</div><p class="muted" style="font-size:11px;margin-top:10px">Demo prescription · ${time}<br>Follow the individual doctor’s plan.</p><div class="btnrow">${['Taken','Skipped','Later'].map(v=>`<button class="${v==='Taken'?'primary':'outline'}" style="font-size:10px;padding:8px 10px" onclick="state.doses['${id}']='${v}';save();render();notify('Dose response logged: ${v}')">${v}</button>`).join('')}</div></div>`).join('')}<div class="notice">Reminder settings are patient controlled. A doctor’s medication change asks for approval before updating reminder times.</div><button class="outline" style="width:100%" onclick="modal('<h2 style=\'margin-top:20px\'>Reminder preferences</h2><label>Repeat interval (minutes)</label><input id=\'repeat\' type=\'number\' min=\'1\' value=\''+(state.repeat||15)+'\'><label>Stop after (minutes)</label><input id=\'stop\' type=\'number\' min=\'1\' value=\''+(state.stop||60)+'\'><div class=\'btnrow\'><button class=\'primary\' onclick=\'savePreferences()\'>Save preferences</button></div>')">Reminder preferences</button><button class="outline" style="width:100%;margin-top:10px" onclick="state.doses.morning='Not Taken';save();render();notify('Reminder deadline simulated; logged as Not Taken.')">Simulate unanswered reminder deadline</button>`}function savePreferences(){const r=Number($('#repeat').value),s=Number($('#stop').value);if(r<1||s<1){notify('Enter positive intervals.');return}state.repeat=r;state.stop=s;save();closeModal();notify('Demo reminder preferences saved.')}
function mobileCare(){const msgs=state.messages.filter(m=>m.patient==='HS-001');return `<span class="eyebrow">YOUR CARE CONNECTION</span><h1 style="margin-top:12px">You’re not alone.</h1><div class="card"><div class="professional"><span class="avatar">SA</span><div><b>Sara Ahmad</b><br><small>Pharmacist · ${state.coverage?'On duty':'Off duty'}</small></div></div><p class="muted" style="font-size:11px;line-height:1.8;margin-top:12px">8-hour pharmacist coverage. Outside working hours, alerts go automatically to your doctor.</p></div><div class="section-title">Messages & doctor decisions</div>${msgs.map(m=>`<div class="chatbubble"><small>${esc(m.by)} · ${m.time}</small><p style="margin-top:8px">${esc(m.text)}</p></div>`).join('')||'<div class="card"><small>No new care messages. Follow-up from the dashboard will appear here.</small></div>'}<div class="section-title">Symptom check-in · demo</div><div class="card"><p class="muted" style="font-size:11px;line-height:1.7">Choose a simulated scenario. This demo does not analyze or diagnose symptoms.</p><div class="btnrow"><button class="outline" style="font-size:11px" onclick="simulate('reading')">Concerning symptoms</button><button class="danger" style="font-size:11px" onclick="simulate('emergency')">Emergency indicators</button></div><p style="font-size:10px;color:var(--muted);line-height:1.7;margin-top:12px">Emergency indicators are sent directly to the doctor. The doctor decides an appointment or emergency care.</p></div>`}
function mobileOnboarding(){const step=state.onboarding;return `<span class="eyebrow">BEFORE YOU BEGIN</span><div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?'active':''}"></i>`).join('')}</div>${step===0?`<h1>Pre-HeatSafe<br>Questionnaire</h1><p class="muted" style="margin-top:12px;font-size:12px;line-height:1.8">Knowledge & Behavior<br>Complete this before speaking with the doctor and before registration.</p><form onsubmit="questionnaire(event)"><label>Knowledge: can heat affect your health condition?</label><select id="knowledge" required style="width:100%"><option value="">Choose an answer</option><option>Yes</option><option>No</option><option>Not sure</option></select><label>Behavior: how often do you take breaks from outdoor heat?</label><select id="behavior" required style="width:100%"><option value="">Choose an answer</option><option>Always</option><option>Sometimes</option><option>Rarely</option><option>Not applicable</option></select><button class="primary" style="width:100%;margin-top:25px">Save & continue →</button></form><div class="notice">Illustrative questionnaire only. No validated score is calculated.</div>`:step===1?`<h1>Meet your doctor</h1><div class="card"><h2>Examination comes first.</h2><p class="muted" style="font-size:12px;line-height:1.8;margin-top:12px">The doctor reviews your health, explains the effect of weather and suitable precautions, and determines your Tailored warnings set.</p><div class="notice">Demo warnings: heat exposure, dehydration and dust.</div></div><button class="primary" style="width:100%;margin-top:20px" onclick="state.onboarding=2;save();render()">Simulate completed doctor visit →</button>`:step===2?`<h1>Complete registration</h1><form onsubmit="event.preventDefault();state.onboarding=3;save();render()"><label>Patient name</label><input value="Ahmad Khalil" readonly style="width:100%"><label>Registered city</label><input value="Amman" readonly style="width:100%"><label>Work exposure</label><input value="Outdoor maintenance" readonly style="width:100%"><div class="notice">Questionnaire, doctor examination, weather education and tailored warnings are linked to this record.</div><button class="primary" style="width:100%">Activate demo monitoring →</button></form>`:`<h1>You’re all set.</h1><div class="card"><span style="font-size:45px;color:var(--green)">✓</span><h2 style="margin-top:14px">Care that knows you.</h2><p class="muted" style="line-height:1.8;margin-top:12px;font-size:12px">Your doctor-reviewed profile and tailored warnings are ready.</p></div><button class="primary" style="width:100%;margin-top:20px" onclick="mobilePage='home';render()">Open my home →</button>`}`}
function questionnaire(e){e.preventDefault();state.answers={knowledge:$('#knowledge').value,behavior:$('#behavior').value};state.onboarding=1;save();render()}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);render()}catch{}}});render();
</script></body></html>
